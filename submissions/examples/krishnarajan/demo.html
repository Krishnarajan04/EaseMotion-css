<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion - Magnet Snap Pull Gravity Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card {
      width: 280px;
      padding: 2rem;
      background: #1e293b;
      border-radius: 1rem;
      border: 1px solid #334155;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    button {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background: #38bdf8;
      border: none;
      border-radius: 0.5rem;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="target" class="card ease-anim-magnet-snap-pull-gravity">
    <h3>Magnet Snap Pull Gravity</h3>
    <p>Hardware-accelerated engine preset test card.</p>
  </div>

  <button onclick="triggerAnimation()">Re-trigger Preset</button>

  <script>
    function triggerAnimation() {
      const el = document.getElementById('target');
      el.classList.remove('ease-anim-magnet-snap-pull-gravity');
      void el.offsetWidth; // Force reflow
      el.classList.add('ease-anim-magnet-snap-pull-gravity');
    }
  </script>
</body>
</html>
